name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Original Kernel
    runs-on: ubuntu-24.04
    steps:
      - name: "⏰Set Time Zone to Beijing"
        run: sudo timedatectl set-timezone "Asia/Shanghai"

      - name: "🚄Set up build environment"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core flex bison build-essential zip curl patch \
            zlib1g-dev libc6-dev-i386 lib32z1-dev libssl-dev unzip xz-utils cpio

      - name: "⭐Checkout build definitions"
        uses: actions/checkout@v7

      - name: "⭐Checkout M62-backport repository with submodules"
        run: |
          git clone --depth=1 --recurse-submodules \
            https://github.com/Star-Seven/M62-backport.git kernel
          cd kernel
          git submodule update --init --recursive
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: "💡 Setup ReSukiSU and SuSFS"
        working-directory: kernel
        run: |
          bash "$GITHUB_WORKSPACE/Bin/clean_hook.sh"
          git clone --branch main https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          patch -p1 < "$GITHUB_WORKSPACE/Patches/Patch/susfs_patch_to_4.14.patch" || true
          git clone --depth=1 --branch samsung_kernel \
            https://github.com/JackA1ltman/NonGKI_Kernel_Patches.git NonGKI_Kernel_Patches
          patch -p1 < NonGKI_Kernel_Patches/note10_plus_exyons9850/susfs_fixed.patch || true
          if ! grep -q '<linux/susfs_def.h>' kernel/kallsyms.c; then
            awk '
              /^#ifdef CONFIG_KALLSYMS_ALL/ && !added {
                print "#ifdef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS"
                print "#include <linux/susfs_def.h>"
                print "#endif"
                added = 1
              }
              { print }
            ' kernel/kallsyms.c > kernel/kallsyms.c.new
            mv kernel/kallsyms.c.new kernel/kallsyms.c
          fi
          bash "$GITHUB_WORKSPACE/Patches/susfs_inline_hook_patches.sh" ./
          find . -type f -name '*.rej' -delete
          if grep -qE 'ksu_handle_(newfstat_ret|fstat64_ret)' fs/stat.c; then
            echo "Unexpected manual stat-return hook in SuSFS inline-hook build."
            exit 1
          fi
          grep -q 'CMD_SUSFS_SHOW_VERSION' drivers/kernelsu/supercall/dispatch.c
          grep -q '^#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          cat >> arch/arm64/configs/ksu.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_THREAD_INFO_IN_TASK=y
          EOF

      - name: "🧰Prepare source installer"
        working-directory: kernel
        run: |
          test -f build/update-binary
          sed -i '/^cp build\/updater-script /d' build.sh
          ! grep -q '^cp build/updater-script ' build.sh

      - name: "🐎Build Unified Kernel Package"
        working-directory: kernel
        run: |
          chmod +x build.sh
          ./build.sh -m all -k y -r n

      - name: "💫Prepare Standard SuSFS ZIP for upload"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload"
          for package in kernel/build/*.zip; do
            test -f "$package"
            base=$(basename "${package%.zip}")
            cp "$package" "$GITHUB_WORKSPACE/upload/${base}-Standard-SuSFS.zip"
          done
          echo "=== Standard SuSFS package ==="
          ls -la "$GITHUB_WORKSPACE/upload/"

      - name: "📝Prepare release metadata"
        run: |
          KERNEL_VERSION=$(grep -o 'CONFIG_LOCALVERSION="[^"]*"' kernel/arch/arm64/configs/exynos9820_defconfig | cut -d '"' -f 2)
          SUSFS_VERSION=$(grep -o 'SUSFS_VERSION "[^"]*"' kernel/include/linux/susfs.h | cut -d '"' -f 2)
          KSU_RESUKISU_VERSION=$(expr $(git -C kernel/KernelSU rev-list --count HEAD) + 10200)
          KSU_RESUKISU_COMMIT=$(git -C kernel/KernelSU rev-parse --short HEAD)
          cat > "$GITHUB_WORKSPACE/upload/release-metadata-standard.env" <<EOF
          M62_COMMIT=${KERNEL_COMMIT}
          KERNEL_VERSION=${KERNEL_VERSION}
          SUSFS_VERSION=${SUSFS_VERSION}
          KSU_RESUKISU_VERSION=${KSU_RESUKISU_VERSION}
          KSU_RESUKISU_COMMIT=${KSU_RESUKISU_COMMIT}
          EOF

      - name: "😎Upload Unified ZIP as artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "M62-S10-Note10-Standard-SuSFS"
          path: |
            ${{ github.workspace }}/upload/*.zip
            ${{ github.workspace }}/upload/release-metadata-standard.env
          if-no-files-found: error
          retention-days: 14

  build-droidspaces:
    name: Build Droidspaces non-GKI Kernel
    runs-on: ubuntu-24.04
    steps:
      - name: "⏰Set Time Zone to Beijing"
        run: sudo timedatectl set-timezone "Asia/Shanghai"

      - name: "🚄Set up build environment"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core flex bison build-essential zip curl patch \
            zlib1g-dev libc6-dev-i386 lib32z1-dev libssl-dev unzip xz-utils cpio

      - name: "⭐Checkout build definitions"
        uses: actions/checkout@v7

      - name: "⭐Checkout M62-backport repository with submodules"
        run: |
          git clone --depth=1 --recurse-submodules \
            https://github.com/Star-Seven/M62-backport.git kernel
          cd kernel
          git submodule update --init --recursive
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: "💡 Setup ReSukiSU and SuSFS"
        working-directory: kernel
        run: |
          bash "$GITHUB_WORKSPACE/Bin/clean_hook.sh"
          git clone --branch main https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          patch -p1 < "$GITHUB_WORKSPACE/Patches/Patch/susfs_patch_to_4.14.patch" || true
          git clone --depth=1 --branch samsung_kernel \
            https://github.com/JackA1ltman/NonGKI_Kernel_Patches.git NonGKI_Kernel_Patches
          patch -p1 < NonGKI_Kernel_Patches/note10_plus_exyons9850/susfs_fixed.patch || true
          if ! grep -q '<linux/susfs_def.h>' kernel/kallsyms.c; then
            awk '
              /^#ifdef CONFIG_KALLSYMS_ALL/ && !added {
                print "#ifdef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS"
                print "#include <linux/susfs_def.h>"
                print "#endif"
                added = 1
              }
              { print }
            ' kernel/kallsyms.c > kernel/kallsyms.c.new
            mv kernel/kallsyms.c.new kernel/kallsyms.c
          fi
          bash "$GITHUB_WORKSPACE/Patches/susfs_inline_hook_patches.sh" ./
          find . -type f -name '*.rej' -delete
          if grep -qE 'ksu_handle_(newfstat_ret|fstat64_ret)' fs/stat.c; then
            echo "Unexpected manual stat-return hook in SuSFS inline-hook build."
            exit 1
          fi
          grep -q 'CMD_SUSFS_SHOW_VERSION' drivers/kernelsu/supercall/dispatch.c
          grep -q '^#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          cat >> arch/arm64/configs/ksu.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_THREAD_INFO_IN_TASK=y
          EOF

      - name: "🩹Apply compatible Droidspaces non-GKI patches"
        working-directory: kernel
        run: |
          git clone --depth=1 https://github.com/Star-Seven/Droidspaces-OSS.git droidspaces
          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"
          if [ -f net/netfilter/xt_qtaguid.c ]; then
            patch -p1 < "$PATCH_DIR/01.fix_kernel_panic_in_xt_qtaguid.patch"
          else
            echo "Skipping patch 01: net/netfilter/xt_qtaguid.c is absent in this kernel tree."
          fi
          test -f kernel/cgroup/cgroup.c
          patch -p1 < "$PATCH_DIR/02.fix_restore cgroup file prefix handling .patch"

      - name: "⚙️Enable Droidspaces configuration"
        working-directory: kernel
        run: |
          sed -i 's/\$REF_CONF \$KSU_CONFIG \$RECOVERY_CONFIG/\$REF_CONF droidspaces.config \$KSU_CONFIG \$RECOVERY_CONFIG/' build.sh
          grep -q 'droidspaces.config' build.sh

      - name: "🧰Prepare source installer"
        working-directory: kernel
        run: |
          test -f build/update-binary
          sed -i '/^cp build\/updater-script /d' build.sh
          ! grep -q '^cp build/updater-script ' build.sh

      - name: "🐎Build Droidspaces Kernel Package"
        working-directory: kernel
        run: |
          chmod +x build.sh
          ./build.sh -m all -k y -r n

      - name: "💫Prepare Droidspaces SuSFS ZIP for upload"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload"
          for package in kernel/build/*.zip; do
            test -f "$package"
            base=$(basename "${package%.zip}")
            cp "$package" "$GITHUB_WORKSPACE/upload/${base}-Droidspaces-SuSFS.zip"
          done
          echo "=== Droidspaces SuSFS package ==="
          ls -la "$GITHUB_WORKSPACE/upload/"

      - name: "📝Prepare release metadata"
        run: |
          KERNEL_VERSION=$(grep -o 'CONFIG_LOCALVERSION="[^"]*"' kernel/arch/arm64/configs/exynos9820_defconfig | cut -d '"' -f 2)
          SUSFS_VERSION=$(grep -o 'SUSFS_VERSION "[^"]*"' kernel/include/linux/susfs.h | cut -d '"' -f 2)
          KSU_RESUKISU_VERSION=$(expr $(git -C kernel/KernelSU rev-list --count HEAD) + 10200)
          KSU_RESUKISU_COMMIT=$(git -C kernel/KernelSU rev-parse --short HEAD)
          cat > "$GITHUB_WORKSPACE/upload/release-metadata-droidspaces.env" <<EOF
          M62_COMMIT=${KERNEL_COMMIT}
          KERNEL_VERSION=${KERNEL_VERSION}
          SUSFS_VERSION=${SUSFS_VERSION}
          KSU_RESUKISU_VERSION=${KSU_RESUKISU_VERSION}
          KSU_RESUKISU_COMMIT=${KSU_RESUKISU_COMMIT}
          EOF

      - name: "😎Upload Droidspaces ZIP as artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "M62-S10-Note10-Droidspaces-SuSFS"
          path: |
            ${{ github.workspace }}/upload/*.zip
            ${{ github.workspace }}/upload/release-metadata-droidspaces.env
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build, build-droidspaces]
    steps:
      - name: "💫Download kernel packages"
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: "📝Generate release notes"
        id: metadata
        run: |
          METADATA_FILE=$(find release-assets -name 'release-metadata-standard.env' -print -quit)
          test -n "$METADATA_FILE"
          set -a
          . "$METADATA_FILE"
          set +a
          TAG_KSU_VERSION=$(printf '%s' "$KSU_RESUKISU_VERSION" | tr -cs 'A-Za-z0-9._-' '-')
          TAG_SUSFS_VERSION=$(printf '%s' "$SUSFS_VERSION" | tr -cs 'A-Za-z0-9._-' '-')
          RELEASE_TAG="m62-${M62_COMMIT}-susfs-${TAG_SUSFS_VERSION}-resukisu-${TAG_KSU_VERSION}-${GITHUB_RUN_NUMBER}"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "name=M62 ${KERNEL_VERSION} · SuSFS ${SUSFS_VERSION} · ReSukiSU ${KSU_RESUKISU_VERSION}" >> "$GITHUB_OUTPUT"
          cat > release-notes.md <<EOF
          ## Galaxy S10 / Note10 Series

          M62 bpf111 · ${KERNEL_VERSION}

          Specific device information: [Supported List](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/Supported_list.md).

          The KernelSU version is for reference only. It is normal for the KernelSU version embedded in SuSFS to be lower.

          - KernelSU-ReSukiSU Version: ${KSU_RESUKISU_VERSION}
          - KernelSU-ReSukiSU Commit: ${KSU_RESUKISU_COMMIT}
          - SuSFS Version: ${SUSFS_VERSION}
          - M62-backport Commit: ${M62_COMMIT}

          This release contains two kernel variants:

          - **Standard-SuSFS** — the standard SuSFS kernel for all supported devices.
          - **Droidspaces-SuSFS** — the SuSFS kernel with Droidspaces non-GKI support.

          Both variants cover S10e, S10, S10 5G, S10+, Note10, Note10 5G, Note10+ and Note10+ 5G. Check the device codename and regional compatibility in Supported List before flashing.
          EOF
          find release-assets -type f -name '*.zip' -print

      - name: "🚀Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }}
          body_path: release-notes.md
          files: |
            release-assets/**/*.zip
          fail_on_unmatched_files: true
